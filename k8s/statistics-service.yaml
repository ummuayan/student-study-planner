
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistics-service
  template:
    metadata:
      labels:
        app: statistics-service
    spec:
      containers:
        - name: statistics-service
          image: ummuayan/student-statistics-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: TASK_SERVICE_URL
              value: http://task-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
spec:
  selector:
    app: statistics-service
  ports:
    - port: 8001
      targetPort: 8001
  type: NodePort
